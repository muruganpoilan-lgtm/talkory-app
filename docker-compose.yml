# Production stack: API + Postgres + Redis + Caddy (automatic HTTPS)
services:
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      PORT: 3000
      DATABASE_URL: postgres://talkory:${POSTGRES_PASSWORD}@db:5432/talkory
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      TERMS_VERSION: ${TERMS_VERSION:-2026-10-03}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APNS_KEY_PATH: /secrets/AuthKey.p8
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SID: ${TWILIO_VERIFY_SID}
      AGORA_APP_ID: ${AGORA_APP_ID}
      AGORA_APP_CERT: ${AGORA_APP_CERT}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      FIREBASE_SERVICE_ACCOUNT: /secrets/firebase-service-account.json
    volumes:
      - ./secrets:/secrets:ro
      - kycdata:/data/kyc
      - avatars:/data/avatars
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: talkory
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on the first start with an empty volume
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkory"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  avatars:
  kycdata:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
