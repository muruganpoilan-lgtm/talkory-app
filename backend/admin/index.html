<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talkory Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f8;--card:#fff;--ink:#191523;--mut:#6e6a7c;--line:#e7e5ee;--soft:#f8f7fb;
--pri:#6c4dff;--pri2:#5636f0;--pris:#efebff;--ok:#12804a;--oks:#e5f4ec;--bad:#cf3626;--bads:#fdecea;--warn:#a86400;--warns:#fff3e0;
--side:#1b1331;--side2:#251a42;--sidet:#bdb5d6;--r:14px}
@media(prefers-color-scheme:dark){:root{--bg:#121019;--card:#1b1825;--ink:#ece9f4;--mut:#9a95ab;--line:#2c2839;--soft:#211d2d;
--pris:#2b2350;--oks:#16301f;--bads:#3a1c19;--warns:#36290f;--side:#0d0b14;--side2:#1a1528}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14.5px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;font-weight:600;font-size:13px;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
button:hover{border-color:#cfcbe0;background:var(--soft)}button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button.pri,button.on{background:var(--pri);border-color:var(--pri);color:#fff}button.pri:hover{background:var(--pri2)}
button.ok{background:var(--oks);border-color:transparent;color:var(--ok)}button.ok:hover{border-color:var(--ok)}
button.bad{background:var(--bads);border-color:transparent;color:var(--bad)}button.bad:hover{border-color:var(--bad)}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
a{color:var(--pri)}svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--mut);font-size:13px}.err{color:var(--bad)}.ok{color:var(--ok)}
/* layout */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sidet);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}.brand img{width:38px;height:38px;border-radius:10px;background:#fff}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:-.01em}.brand small{color:#8f86ad;font-size:12px}
aside nav{flex:1}.grp{margin-bottom:14px}.gl{font-size:11.5px;color:#7d749c;padding:0 10px 4px;font-weight:600}
.ni{width:100%;justify-content:flex-start;gap:10px;background:none;border:0;border-radius:9px;color:var(--sidet);padding:8px 10px;font-weight:500;font-size:13.5px;position:relative}
.ni:hover{background:var(--side2);color:#fff}.ni.on{background:var(--side2);color:#fff}
.ni.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#9b80ff}
.ni span{flex:1;text-align:left}.bd{font-style:normal;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:99px;background:#ff5d8f;color:#fff;text-align:center;display:none}
.bd.show{display:inline-block}.lo{margin-top:8px;border-top:1px solid var(--side2);border-radius:0;padding-top:14px}
main{padding:28px 32px 48px;min-width:0;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;letter-spacing:-.02em;font-weight:800}.top p{margin:2px 0 0}.tact{display:flex;gap:8px}
/* table card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cnt{padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut);font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{padding:13px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12.5px;background:var(--soft);white-space:nowrap}
tr:last-child td{border:0}tbody tr:hover td{background:var(--soft)}td:first-child{font-weight:600}
td.act{white-space:nowrap}td.act>div{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:56px 24px;text-align:center;color:var(--mut);display:grid;justify-items:center;gap:6px}
.empty svg.i{width:40px;height:40px;stroke-width:1.4;color:var(--pri);background:var(--pris);padding:9px;border-radius:14px;box-sizing:content-box;margin-bottom:6px}
.empty b{color:var(--ink);font-size:16px}.empty.err b{color:var(--bad)}
/* overview */
.money{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin-bottom:22px}
.mb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.mb.hero{background:linear-gradient(135deg,#6c4dff,#9a5cff 60%,#ff6fa5);color:#fff;border:0}
.mb .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px}.mb .l{font-size:13px;opacity:.8;font-weight:600}
.sec{font-size:15px;font-weight:700;margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--pri);transform:translateY(-1px)}.tile:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.tile .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;color:var(--mut)}
.tile .h svg.i{color:var(--pri);background:var(--pris);padding:6px;border-radius:9px;box-sizing:content-box}
.tile .n{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}.tile .s{font-size:12.5px;color:var(--mut)}
.tile.hot{border-color:#d9cfff;background:linear-gradient(180deg,var(--pris),var(--card) 70%)}.tile.hot .s{color:var(--pri);font-weight:600}
.sk{height:104px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--soft),var(--card));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 600px at 10% -10%,#3a2477 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#5a1f55 0,transparent 55%),var(--side)}
.lcard{width:min(380px,100%);background:var(--card);border-radius:20px;padding:30px 28px;display:grid;gap:14px;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
.lcard img{width:72px;height:72px;border-radius:18px;justify-self:center}.lcard h1{margin:0;text-align:center;font-size:22px;letter-spacing:-.02em}
.lcard p{margin:-8px 0 4px;text-align:center}.lcard label{display:grid;gap:5px;font-size:13px;font-weight:600}
.lcard button.pri{justify-content:center;padding:12px;font-size:14px}.link{background:none;border:0;color:var(--pri);justify-content:center}
/* signed agreement */
.sdoc{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:18px 20px;margin-top:6px}
.sdoc h4{margin:0 0 12px;font-size:15px;text-align:center}.sbody{white-space:pre-wrap;font:13.5px/1.65 Georgia,"Times New Roman",serif;max-height:46vh;overflow:auto;padding-right:6px}
.ssig{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sline{background:#fff;border-bottom:1.5px solid #222;border-radius:8px 8px 0 0;padding:6px 14px 4px;min-width:240px;text-align:center}.sline img{max-height:96px;max-width:260px;display:block;margin:auto}
.smeta{display:grid;justify-items:end;font-size:12.5px;color:var(--mut)}.smeta b{color:var(--ink);font-size:13.5px}
.dact{display:flex;gap:8px;justify-content:flex-end;margin:14px 0 0}
/* dialogs */
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 30px 80px -20px rgba(20,10,50,.45)}
dialog::backdrop{background:rgba(18,12,35,.45);backdrop-filter:blur(3px)}dialog h3{font-size:18px;letter-spacing:-.01em}
@media(max-width:860px){.shell{grid-template-columns:1fr}
 aside{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;align-items:center;padding:10px;gap:8px;overflow-x:auto}
 .brand{padding:0 6px 0 2px}.brand div{display:none}aside nav{display:flex;gap:4px}.grp{display:flex;gap:4px;margin:0}.gl{display:none}
 .ni{width:auto;white-space:nowrap}.ni.on::before{display:none}.lo{margin:0;border:0;padding:8px 10px}.lo span{display:none}
 main{padding:20px 14px 40px}.money{grid-template-columns:1fr 1fr}.mb.hero{grid-column:1/-1}td.act>div{justify-content:flex-start}.tiles{grid-template-columns:1fr 1fr}.tile .n{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);let token=sessionStorage.t||'',tab='overview',phone='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Opens GPay / PhonePe (works when this panel is open in the browser on a phone) with the UPI ID and amount filled in
function payInApp(app,r){const q='pa='+encodeURIComponent(r.upi_id)+'&pn='+encodeURIComponent(r.display_name)+'&am='+(r.amount/100).toFixed(2)+'&cu=INR&tn='+encodeURIComponent('Talkory payout');
  location.href=(app==='gpay'?'tez://upi/pay?':'phonepe://pay?')+q;
  setTimeout(()=>{if(!document.hidden&&confirm('Could not open the app. Open any UPI app instead?'))location.href='upi://pay?'+q},1500)}
const aiTag=v=>typeof v==='number'?' <span class="'+(v>=0.5?'err':'mut')+'">'+(v>=0.5?'⚠ ':'')+'AI check: '+Math.round(v*100)+'%</span>':'';
const rs=p=>'₹'+(p/100).toLocaleString('en-IN',{minimumFractionDigits:2});
const when=d=>d?new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';
async function api(path,body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body&&JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&token){logout();throw Error('Session expired')}
  if(!r.ok)throw Error(d.error||'Request failed');return d}
function logout(){token='';isOwner=null;counts={};sessionStorage.removeItem('t');render()}
function login(){$('#app').innerHTML=`<div class="login"><div class="lcard"><img src="/panel/logo.png" alt="Talkory Tech"><h1>Talkory Admin</h1>
<p class="mut">${phone?'Enter the OTP sent to '+esc(phone):'Sign in with your admin phone number'}</p>
<label>Phone number<input id="ph" placeholder="+91XXXXXXXXXX" inputmode="tel" value="${esc(phone)}" ${phone?'disabled':''}></label>
<label style="display:${phone?'':'none'}">OTP<input id="cd" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code"></label>
<button class="pri" id="go">${phone?'Verify and sign in':'Send OTP'}</button><div class="err" id="e"></div>
${phone?'<button class="link" id="chg">Use another number</button>':''}</div></div>`;
  const go=async()=>{try{$('#go').disabled=true;const p=$('#ph').value.trim();
    if(!phone){await api('/auth/request-otp',{phone:p});phone=p;login();$('#cd').focus()}
    else{const d=await api('/auth/verify-otp',{phone,code:$('#cd').value.trim(),role:'admin'});token=d.token;sessionStorage.t=token;render()}
  }catch(e){$('#e').textContent=e.message;$('#go').disabled=false}};
  $('#go').onclick=go;$('#app').querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
  if($('#chg'))$('#chg').onclick=()=>{phone='';login()}}
const TABS={
 earnings:{url:'/admin/earnings',cols:['','Details','When'],
  row:r=>r.kind==='summary'?['<b>Available '+rs(r.available)+'</b>','Paid calls '+rs(r.calls)+' · Chats '+rs(r.chats)+' · Free calls (cost) '+rs(r.free)+' · Withdrawn '+rs(r.withdrawn)+' · Today '+rs(r.today)+' · This month '+rs(r.month),'']:['Withdrawn '+rs(r.amount),'to '+esc(r.upi_id),when(r.created_at)],
  acts:r=>r.kind!=='summary'?[]:[['Withdraw to UPI','ok','/admin/earnings/withdraw',()=>{const g=(prompt('Which app? Type g for GPay or p for PhonePe:',r.upi_app==='phonepe'?'p':'g')||'g').toLowerCase().startsWith('p')?'phonepe':'gpay';const u=prompt('Your '+(g==='gpay'?'GPay':'PhonePe')+' UPI ID (like name@bank):',r.upi_id||'');return {upiId:u||'',upiApp:g}},'Withdraw '+rs(r.available)+' to your UPI?']]},
 agreements:{url:'/admin/agreements',cols:['User','Phone','Signed as','When'],row:r=>[esc(r.display_name),esc(r.phone),esc(r.full_name),when(r.signed_at)],
  acts:r=>[['View signature','',null,()=>viewSignature(r.id)]]},
 inactive:{url:'/admin/inactive-hosts',cols:['Host','Away','Wallet','What happens'],
  row:r=>[esc(r.display_name)+' <span class="mut">('+esc(r.phone)+')</span>',r.days_away+' days',rs(r.balance),
   r.state==='waiting'?'<b class="err">Not deleted: money in wallet. Ask the host to withdraw.</b>':r.state==='due'?'Records are deleted tonight':'Records deleted in '+r.deletes_in_days+' days'],
  acts:r=>[]},
 admins:{url:'/admin/admins',cols:['Name','Phone','Role','Added'],
  row:r=>[esc(r.display_name),esc(r.phone),r.is_owner?'<b class="ok">Owner</b>':r.is_blocked?'<span class="mut">Removed</span>':'Admin',when(r.created_at)],
  acts:r=>(r.is_owner||r.is_blocked)?[]:[['Remove access','bad','/admin/admins/'+r.id+'/remove',()=>({}),'Remove admin access for '+r.display_name+'? They can no longer log in.']]},
 records:{url:'/admin/host-records',cols:['Host','KYC','Saved in database','Last saved'],
  row:r=>[esc(r.display_name)+' <span class="mut">('+esc(r.phone)+')</span>',esc(r.kyc),(r.files||[]).length+' files',when(r.last_at)],
  acts:r=>[['Open records','',null,()=>viewRecords(r)]]},
 contracts:{url:'/admin/contracts',cols:['Host','Signed as','When','IP'],row:r=>[esc(r.display_name),esc(r.full_name),when(r.signed_at),esc(r.ip||'')],acts:r=>r.agreement_id?[['View signed agreement','',null,()=>viewRecords({display_name:r.display_name,files:[{id:r.agreement_id,kind:'agreement',at:r.signed_at},...(r.signature_id?[{id:r.signature_id,kind:'signature',at:r.signed_at}]:[])]})]]:[]},
 invoices:{url:'/admin/invoices',cols:['Invoice','Host','Withdrawn','GST','Paid to host','Paid'],row:r=>[esc(r.invoice_no),esc(r.display_name),rs(r.amount),rs(r.gst_paise),rs(r.net_paise),when(r.paid_at)],
  acts:r=>[['View PDF','',null,()=>openInvoice(r.id)]]},
 receipts:{url:'/admin/invoices/receipts',cols:['Invoice','User','Coins','Paid','When'],row:r=>[esc(r.invoice_no),esc(r.display_name),rs(r.amount),rs(r.paid),when(r.paid_at)],
  acts:r=>[['View PDF','',null,()=>openInvoice(r.id,'/invoices/admin-receipt/')]]},
 payouts:{url:'/partner/admin/payouts',cols:['Partner','Pay (after GST)','UPI ID','Pay on','Requested'],
  row:r=>[esc(r.display_name)+(r.kyc!=='approved'?' <span class="err">(KYC '+r.kyc+')</span>':''),rs(r.amount)+(r.gst_paise!=null?' <span class="mut">(of '+rs(r.gross)+', GST '+rs(r.gst_paise)+')</span>':''),esc(r.upi_id)+(r.upi_app?' <span class="mut">('+(r.upi_app==='gpay'?'GPay':'PhonePe')+')</span>':''),esc(r.pay_on||'any day'),when(r.requested_at)],
  acts:r=>[...(r.status==='requested'||r.status==='processing'?(r.upi_app==='phonepe'?['phonepe','gpay']:['gpay','phonepe']).map(a=>['Pay via '+(a==='gpay'?'GPay':'PhonePe'),'',null,()=>payInApp(a,r)]):[]),['Mark paid','ok','/partner/admin/payouts/'+r.id+'/paid',()=>({reference:prompt('Payment reference (UPI txn id):','')??null}),'Confirm you have sent '+rs(r.amount)+' to '+r.upi_id+'?'],
           ['Reject','bad','/partner/admin/payouts/'+r.id+'/reject',()=>({}),'Reject and refund the partner wallet?']]},
 kyc:{url:'/admin/kyc',cols:['Partner','Languages','Rate/min','Bio','Joined'],
  row:r=>[esc(r.display_name)+aiTag(r.ai),esc((r.languages||[]).join(', ')),rs(r.rate_per_min),esc(r.bio),when(r.created_at)],
  acts:r=>[['View documents','',null,()=>viewDocs(r.id)],['Rename','',null,async()=>{const n=prompt('New display name for '+r.display_name+':',r.display_name);if(!n||!n.trim())return;try{await api('/admin/accounts/'+r.id+'/rename',{name:n.trim()});render()}catch(x){alert(x.message)}}],['Approve','ok','/admin/kyc/'+r.id,()=>({status:'approved'})],['Reject','bad','/admin/kyc/'+r.id,()=>({status:'rejected',note:prompt('Reason the partner will see:','Photo unclear, please resubmit')||''})]]},
 reports:{url:'/admin/reports',cols:['Reported','Reason','By','Reports','Date'],
  row:r=>[esc(r.reported)+' <span class="mut">('+r.reported_role+(r.is_blocked?', blocked':'')+')</span>',esc(r.reason),esc(r.reporter),r.total_reports,when(r.created_at)],
  acts:r=>[['Dismiss','','/admin/reports/'+r.id+'/resolve',()=>({block:false})],['Block account','bad','/admin/reports/'+r.id+'/resolve',()=>({block:true}),'Block '+r.reported+'? They can no longer log in.']]},
 intros:{url:'/admin/intros',cols:['Host'],row:r=>[esc(r.display_name)],
  acts:r=>[['Listen','',null,()=>listenIntro(r.id)],['Approve','ok','/admin/intros/'+r.id,()=>({status:'approved'})],['Reject','bad','/admin/intros/'+r.id,()=>({status:'rejected',note:prompt('Reason the host will see:','Please re-record: clear voice, no contact details')||''})]]},
 locations:{url:'/admin/locations',cols:['Name','Role','Approx. location','Updated'],
  row:r=>[esc(r.display_name),esc(r.role),'<a href="https://www.google.com/maps?q='+encodeURIComponent(r.lat+','+r.lng)+'" target="_blank" rel="noopener">'+esc(r.lat)+', '+esc(r.lng)+'</a>',when(r.location_at)],
  acts:r=>[]},
 video:{url:'/admin/video-calls/accounts',cols:['Name','Role','Phone'],
  row:r=>[esc(r.display_name),esc(r.role),esc(r.phone)],
  acts:r=>[['Video call','ok',null,()=>videoCall(r)]]},
 meetings:{url:'/admin/meetings',cols:['Title','Who','Status','When'],
  row:r=>[esc(r.title),({everyone:'Everyone',users:'All users',partners:'All hosts',selected:'Selected people'})[r.audience]||esc(r.audience),r.status==='live'?'<b class="ok">LIVE</b>':esc(r.status),when(r.scheduled_at||r.started_at)],
  acts:r=>r.status==='ended'?[]:[[r.status==='live'?'Join':'Start now','ok',null,()=>meetingRoom(r.id,r.title)],['End','bad','/admin/meetings/'+r.id+'/end',()=>({}),'End this meeting for everyone?']]},
 support:{url:'/admin/tickets',cols:['Customer','Subject','Last message','Updated'],
  row:r=>[esc(r.display_name)+' <span class="mut">('+r.role+', '+esc(r.phone)+')</span>',(r.needs_reply?'<b class="err">● </b>':'')+esc(r.subject),esc((r.last_body||'').slice(0,120)),when(r.updated_at)],
  acts:r=>[['Open & reply','',null,()=>openTicket(r.id)],['Close','bad','/admin/tickets/'+r.id+'/close',()=>({}),'Close this ticket?']]},
 photos:{url:'/admin/avatars',cols:['Host'],row:r=>[esc(r.display_name)+aiTag(r.ai)],
  acts:r=>[['View photo','',null,()=>viewPhoto(r.id)],['Approve','ok','/admin/avatars/'+r.id,()=>({status:'approved'})],['Reject','bad','/admin/avatars/'+r.id,()=>({status:'rejected',note:prompt('Reason the host will see:','Please use a clear photo of yourself with no text or contact details')||''})]]}};

let agoraLoaded=null;
function loadAgora(){return agoraLoaded||(agoraLoaded=new Promise((ok,no)=>{const s=document.createElement('script');
  s.src='https://download.agora.io/sdk/release/AgoraRTC_N-4.22.0.js';s.onload=ok;s.onerror=()=>{agoraLoaded=null;no(Error('Could not load the video library'))};document.head.appendChild(s)}))}
async function videoCall(r){
  if(!confirm('Start a video call with '+r.display_name+'? Your camera and microphone will turn on.'))return;
  const d=document.createElement('dialog');d.style.cssText='width:min(760px,96vw)';
  d.innerHTML=`<h3 style="margin:0 0 4px">Video call: ${esc(r.display_name)}</h3><div class="mut" id="vs">Starting…</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0"><div id="rv" style="background:#000;aspect-ratio:4/3;border-radius:10px"></div><div id="lv" style="background:#000;aspect-ratio:4/3;border-radius:10px"></div></div>
<p style="display:flex;gap:8px;justify-content:flex-end;margin:0"><button id="mu">Mute</button><button id="cm">Camera off</button><button class="bad" id="en">End call</button></p>`;
  document.body.appendChild(d);d.showModal();
  const st=t=>{d.querySelector('#vs').textContent=t};

async function render(){

  if(isOwner===null){try{isOwner=!!(await api('/admin/me')).isOwner}catch(e){isOwner=false}}
  if(!META[tab]||!canSee(tab))tab='overview';
  const m=META[tab];
  const nav=GROUPS.map(([g,ks])=>{ks=ks.filter(canSee);if(!ks.length)return'';
    return `<div class="grp">${g?'<div class="gl">'+g+'</div>':''}${ks.map(k=>`<button class="ni${k===tab?' on':''}" data-t="${k}" ${k===tab?'aria-current="page"':''}>${ic(META[k][2])}<span>${META[k][0]}</span><i class="bd" data-b="${k}"></i></button>`).join('')}</div>`}).join('');

  $('#body').innerHTML='<div class="card" id="list"><div class="empty"><span class="mut">Loading…</span></div></div>';
  const T=TABS[tab];let rows=[];
  try{rows=await api(T.url)}catch(e){return $('#list').innerHTML='<div class="empty err">'+ic('flag')+'<b>Could not load</b><span>'+esc(e.message)+'</span></div>'}
  if(!rows.length)return $('#list').innerHTML='<div class="empty">'+ic(m[2])+'<b>All clear</b><span>'+m[3]+'</span></div>';
  $('#list').innerHTML=`<div class="cnt">${rows.length} ${rows.length===1?'item':'items'}</div><div class="tw"><table><thead><tr>${T.cols.map(c=>'<th>'+c+'</th>').join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${T.row(r).map(c=>'<td>'+c+'</td>').join('')}<td class="act"><div>${T.acts(r).map((a,j)=>`<button class="${a[1]}" data-i="${i}" data-j="${j}">${a[0]}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`;
  $('#list').onclick=async e=>{const b=e.target.closest('button[data-i]');if(!b)return;
    const r=rows[b.dataset.i],a=T.acts(r)[b.dataset.j];if(!a[2])return a[3]();if(a[4]&&!confirm(a[4]))return;
    try{b.disabled=true;await api(a[2],a[3]());render()}catch(x){alert(x.message);b.disabled=false}}}
render();
