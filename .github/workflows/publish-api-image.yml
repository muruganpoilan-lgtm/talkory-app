name: Publish API image

# Builds the backend and publishes it to GitHub Container Registry as ghcr.io/<your-username>/talkory-api:latest.
# Run it once by hand (Actions > Publish API image > Run workflow); it also reruns when backend/ changes on main.
# Afterwards make the package Public (see DEPLOY.md) so the server can pull it without a login.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/talkory-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE }}:latest
