name: Build Android apps

# GitHub > Actions > "Build Android apps" > Run workflow. About 10-15 minutes.
# Result: download the "talkory-apks" artifact from the run page. It contains Talkory.apk and "Talkory Partner.apk".
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Your backend URL, e.g. https://api.yourdomain.com'
        required: true
      org:
        description: 'App id prefix (apps become <org>.talkory_user and <org>.talkory_partner)'
        required: false
        default: 'com.talkory'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Build both APKs
        env:
          API_URL: ${{ inputs.api_url }}
          ORG: ${{ inputs.org }}
          APK_ONLY: '1'
          # Optional repository secrets (Settings > Secrets and variables > Actions). Leave unset to skip.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: bash scripts/build-apps.sh
      - uses: actions/upload-artifact@v4
        with:
          name: talkory-apks
          path: dist/*.apk
          if-no-files-found: error
